# Posts rooms that Claude queued in advance (ledger status QUEUED), so posting keeps going when Claude has no credits.
# Needs the repository secret IG_ACCESS_TOKEN. Slots: 11:30, 17:30, 20:30 KST.
name: queued-post
on:
  schedule:
    - cron: '30 2,8,11 * * *'
    # retries: GitHub often delays or drops scheduled runs; a retry posts only a room that is still QUEUED and due
    - cron: '55 2,8,11 * * *'
    - cron: '25 3,9,12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: queued-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest ledger, so a queued retry never re-posts a room an earlier run just posted
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Post the earliest due room
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 -I kit/queue_post.py "$(git rev-parse HEAD)"
      - name: Save the ledger
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add kit/ledger.json rooms
          git diff --cached --quiet && exit 0
          git commit -m "queued post published"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
